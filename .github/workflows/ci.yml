name: Android CI

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect Android changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base=""
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
          esac
          android=true
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}"; then
            if changed="$(git diff --name-only "$base" "${{ github.sha }}")"; then
              if ! grep -Eq '^(app/|gradle/|scripts/|gradlew$|gradlew\.bat$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)' <<< "$changed"; then
                android=false
              fi
            fi
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"

      - name: Confirm documentation-only change
        if: steps.changes.outputs.android != 'true'
        run: echo "No Android or build inputs changed; required check passes without Gradle."

      - name: Run SDK-free contract scripts
        if: steps.changes.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.py; do
            echo "::group::$script"
            python3 "$script"
            echo "::endgroup::"
          done

      - name: Set up JDK 17
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Grant execute permission for gradlew
        if: steps.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Build, test, lint and validate release APK
        if: steps.changes.outputs.android == 'true'
        run: >-
          ./gradlew
          testDebugUnitTest
          lint
          assembleDebug
          assembleRelease
          -PreleaseSigningRequired=false

      - name: Upload Debug APK
        if: steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flowpilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
