name: Android CI

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  instrumentation:
    name: Android instrumentation (manual emulator gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest --no-daemon

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect Android changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -Eq '^(app/|gradle/|scripts/|gradlew$|gradlew\.bat$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm documentation-only change
        if: steps.changes.outputs.android != 'true'
        run: echo "No Android or build inputs changed; required check passes without Gradle."

      - name: Set up JDK 17
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Grant execute permission for gradlew
        if: steps.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Run unit tests
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android lint
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew lint --no-daemon

      - name: Assemble Debug APK
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate Release APK
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew assembleRelease -PreleaseSigningRequired=false --no-daemon

      - name: Upload Debug APK
        if: steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flowpilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
